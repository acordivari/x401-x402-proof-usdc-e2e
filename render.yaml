# Render blueprint for the wallet-demo orchestrator (apps/wallet-demo).
#
# One web service: it builds the Svelte SPA and then serves it from the same
# Express process that hosts the API, so the browser only ever sees one origin —
# no CORS, and the SameSite=Lax session cookie keeps working. Put a CDN in front
# of this (e.g. a Netlify 200-rewrite of /api/* and /proof/*) only if you keep
# that single-origin property; a split origin would need SameSite=None cookies.
#
# BUILD COMMAND, the non-obvious part: NODE_ENV=production below is what puts the
# orchestrator in its "exposed" posture (fail-closed secrets + Secure cookies +
# no Express stack traces in error responses). But npm ALSO reads NODE_ENV and
# would skip devDependencies — which is where vite lives — so `npm run build:web`
# would fail. `--include=dev` overrides that for the build. The runtime is fine
# either way: tsx is a real dependency, since nothing here is precompiled.
services:
  - type: web
    name: agentic-payments-demo
    runtime: node
    # `free` spins down after ~15 min idle and cold-starts in ~50s. That is fine
    # for a link you share directly, but it exceeds a Netlify proxy's ~26s
    # timeout — move to `starter` if you front this with a CDN rewrite.
    plan: free
    branch: main
    buildCommand: npm ci --include=dev && npm run build:web
    startCommand: npm run demo:server
    # Cheap by design. Under DEMO_OPEN_ACCESS it serves the full status payload,
    # which is the point — there is nothing gated left for it to withhold.
    healthCheckPath: /api/me
    envVars:
      - key: NODE_VERSION
        value: "20"

      # --- posture: exposed => fail closed on every secret below ---
      - key: NODE_ENV
        value: production

      # --- ACCESS: deliberately OPEN. No login screen, no token to copy — a
      #     visitor lands on a working demo. This is an explicit opt-in, not a
      #     default: with NODE_ENV=production and neither DEMO_OPEN_ACCESS nor
      #     DEMO_AUTH_TOKEN, the orchestrator refuses to boot rather than come
      #     up unprotected by accident.
      #
      #     Safe here for the same reason the old published token was: this
      #     service cannot move value. The agent signer is a throwaway key
      #     generated at boot and the facilitator is hard-wired to "mock", so a
      #     visitor buys mock inventory with mock settlement. config.ts enforces
      #     that — it refuses to boot with DEMO_OPEN_ACCESS alongside
      #     PROOF_MODE=live (which would let any visitor spend the org's Proof
      #     credentials), and alongside either token, so a leftover credential
      #     can never sit here looking like protection that isn't there.
      #
      #     MIGRATING FROM THE GATED DEPLOY: removing these keys from this file
      #     does NOT remove them from the service. Delete DEMO_AUTH_TOKEN and
      #     DEMO_PUBLIC_TOKEN in the Render dashboard (Environment), or the boot
      #     will fail with exactly that complaint. To take the demo private
      #     again, drop DEMO_OPEN_ACCESS and re-add DEMO_AUTH_TOKEN.
      #
      #     State-changing /api/* calls are capped at 120/min/IP in this mode
      #     (see PUBLIC_WRITE_MAX_PER_MIN); GETs are exempt because the UI polls
      #     /api/orders and /api/me on a timer.
      - key: DEMO_OPEN_ACCESS
        value: "true"

      # --- required secrets, both fail-closed: the orchestrator refuses to boot
      #     without them. Server-only — nothing ever needs to read them back, so
      #     letting Render mint them beats choosing them by hand. ---
      - key: DEMO_SESSION_SECRET # signs the session cookie; stable => sessions survive redeploys
        generateValue: true
      - key: X401_ENCRYPTOR_KEY # authenticates the challenge state sealing the payment binding
        generateValue: true

      # --- the in-process merchant. 0 = ephemeral loopback port; Render routes
      #     only $PORT publicly, so the merchant stays internal either way. ---
      - key: MERCHANT_PORT
        value: "0"

      # --- Proof VC layer, pinned to the Fairfax sandbox. The orchestrator
      #     REFUSES TO BOOT if these drift off sandbox/development (see
      #     apps/wallet-demo/server/config.ts). Stated explicitly here rather
      #     than left to defaults so the pin is visible in the deploy config. ---
      - key: PROOF_ENVIRONMENT
        value: sandbox # => api.fairfax.proof.com
      - key: PROOF_TRUST_ROOT
        value: development
      # `local` runs the fully offline self-issued substrate. Switch to `live`
      # only once the three PROOF_* values below are filled in.
      - key: PROOF_MODE
        value: local
      - key: PROOF_CLIENT_ID
        sync: false
      - key: PROOF_CLIENT_SECRET
        sync: false
      # Must be this service's public URL + /proof/callback (or your CDN's), and
      # must be registered as a redirect URI on the Proof OAuth app.
      - key: PROOF_REDIRECT_URI
        sync: false

      # --- the recorded Proof exhibit (optional) ---
      # A real, signed credential artifact. It is NOT in the repo and must never
      # be: add it in the Render dashboard as a SECRET FILE (Environment ->
      # Secret Files) with filename `.proof-recording.json`, which Render mounts
      # at the repo root — exactly where the default below looks. Produce it with
      # `npm run record:proof`.
      #
      # Deliberately a secret file rather than a committed asset: the Fairfax
      # credential carries no `exp` and no status list, so it neither expires nor
      # can be revoked upstream. Deleting the secret file is the ONLY way to
      # withdraw it, and that only works if it was never committed. Absent file
      # => the exhibit card simply does not render; nothing else changes.
      #
      # Note this needs no Proof credentials at all: the SDK's verify half pins
      # to a trust store that ships in the package, so PROOF_MODE stays `local`,
      # the service holds no Proof secret, and DEMO_OPEN_ACCESS stays legal.
      #
      # Absolute on purpose. Render exposes every secret file at
      # /etc/secrets/<filename> at runtime, always; the copy in the service root
      # is a non-Docker convenience. An absolute path also sidesteps cwd
      # entirely — startCommand runs from apps/wallet-demo, so a bare relative
      # name would resolve there. (A relative value IS still supported and
      # resolves against the repo root, not cwd; see config.ts.)
      # The boot log prints the resolved path and whether it loaded.
      - key: PROOF_EXHIBIT_FILE
        value: /etc/secrets/.proof-recording.json

      # NOTE: DEMO_PORT is deliberately absent — Render injects PORT, which the
      # config prefers. Setting DEMO_PORT here would bind an unroutable port.
